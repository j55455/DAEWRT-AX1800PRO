#CI项目：mosdns + nikki 变体（不编入 dae/daed）
name: QCA-LiBwrt-MOS

#CI计划
on:
  #自动编译：当Auto-Clean运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
       - completed
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [IPQ60XX-WIFI]
#LiBwrt
        SOURCE: [LiBwrt/LibWrt]
        BRANCH: [25.12-nss]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #固件变体：daed=kenzok8 dae+daed（默认）；mosdns=mosdns+nikki，不编入 dae/daed
      WRT_VARIANT: mosdns
      #默认主题
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: NERCH_MOS
      #默认WIFI名称
      WRT_SSID: NERCH_MOS
      #默认WIFI密码
      WRT_WORD: 8765432101
      #默认地址
      WRT_IP: 10.0.0.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}

      CI_NAME: ${{github.workflow}}
