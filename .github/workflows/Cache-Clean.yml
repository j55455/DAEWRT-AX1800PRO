name: Cache-Clean

on:
  schedule:
    # 每月1号4:00 (UTC 20:00) 独立清理全部缓存，不串联周常编译
    - cron: 0 20 1 * *
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Cache Clean
        run: gh cache delete --all
